# seo-gsc configuration. Copy to config.yaml and edit. Safe to commit config.yaml
# (it holds NO secrets; the service-account path lives only in .env.local).

properties:
  # One block per site. The key is what you pass to `--property`.
  portfolio:
    name: example.com
    # Domain property if verified at the domain level, else the URL prefix
    # (`https://example.com/`). These are different properties in Search
    # Console and they return different data, so match what you verified.
    site_url: sc-domain:example.com
    ga4_property_id: null        # e.g. "properties/123456789" once known
    default_country: null        # null = all countries
    notes: Free-text. Shown in report headers.

  shop:
    name: shop.example.com
    site_url: https://shop.example.com/
    ga4_property_id: null
    default_country: usa         # ISO-3166-1 alpha-3, as Search Console reports it
    notes: A second property, to show the shape.

# Tunable cut-offs for the five modes. Defaults shown; override per deployment.
thresholds:
  quick_win_min_position: 5.0
  quick_win_max_position: 15.0
  quick_win_min_impressions: 200
  low_ctr_factor: 0.7            # flag CTR below 70% of expected for the position
  low_ctr_min_impressions: 100
  gap_min_impressions: 50
  gap_max_clicks: 1
  cluster_min_queries: 2
  cluster_min_shared_tokens: 1

# Optional: override the expected-CTR-by-position curve to match your audience.
# Brand-heavy sites earn higher position-1 CTR than informational ones.
# ctr_curve:
#   1: 0.32
#   2: 0.17
#   3: 0.11
